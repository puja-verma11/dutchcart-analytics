name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DBT_CI_SCHEMA: CI_PR_${{ github.event.number }}
    defaults:
      run:
        working-directory: dutchcart
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: CI - build and test in a temporary schema
        if: github.event_name == 'pull_request'
        run: uv run dbt build --target ci --profiles-dir .

      - name: CD - deploy to production schemas
        if: github.event_name == 'push'
        run: uv run dbt build --target prod --profiles-dir .