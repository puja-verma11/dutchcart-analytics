version: 2

models:
  - name: fct_orders
    description: "One row per order with items, delivery, return and review info"
    columns:
      - name: order_id
        description: "Unique order. If this test fails, a join caused fan-out"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: net_revenue
        data_tests:
          - not_null
  - name: dim_customers
    description: "One row per customer with lifetime orders, revenue and segment"
    columns:
      - name: customer_id
        description: "Unique customer. If this fails, a join duplicated customers"
        data_tests:
          - unique
          - not_null
      - name: value_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]